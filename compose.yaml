services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: latveria
      POSTGRES_PASSWORD: latveria
      POSTGRES_DB: latveria
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latveria -d latveria"]
      interval: 2s
      timeout: 5s
      retries: 15

  adminer:
    image: adminer:5.4.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
