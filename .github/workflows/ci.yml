name: CI and images

on:
  pull_request:
  push:
    branches: [main, staging]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: latveria
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: latveria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U latveria -d latveria"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://latveria:ci-password@127.0.0.1:5432/latveria
      DATABASE_MIGRATION_URL: postgresql://latveria:ci-password@127.0.0.1:5432/latveria
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check:commits
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.sha }}
      - run: bun run check
      # Migrate dan seed dijalankan dua kali dengan sengaja: run kedua memverifikasi idempotensi.
      - run: bun run db:migrate
      - run: bun run db:migrate
      # Seed dibutuhkan test:integration (tujuh subtes dan soal contoh).
      - run: bun run db:seed
      - run: bun run db:seed
      # test:integration menguji unggah avatar ke S3. Image minio/minio sudah tidak tersedia di Docker Hub,
      # jadi CI memakai image Chainguard dengan kredensial dan bucket bawaan storage.service (port 9002).
      - name: Start MinIO
        run: |
          mkdir -p "$RUNNER_TEMP/minio/latveria-avatars"
          chmod -R 777 "$RUNNER_TEMP/minio"
          docker run -d --name minio -p 127.0.0.1:9002:9000 \
            -e MINIO_ROOT_USER=latveria -e MINIO_ROOT_PASSWORD=latveria123 \
            -v "$RUNNER_TEMP/minio:/data" cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9002/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - run: bun run test:integration

  containers:
    needs: checks
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: latveria-ci
      IMAGE_PREFIX: latveria
      IMAGE_TAG: ci
      POSTGRES_PASSWORD: ci-password
      DATABASE_URL: postgresql://latveria:ci-password@postgres:5432/latveria
      DATABASE_MIGRATION_URL: postgresql://latveria:ci-password@postgres:5432/latveria
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-123456789
      BETTER_AUTH_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: docker/setup-buildx-action@v3
      - name: Free disk space for full TeX Live image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: latveria-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: latveria-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build TeX worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/tex-worker/Dockerfile
          load: true
          tags: latveria-tex-worker:ci
          cache-from: type=gha,scope=tex-worker
          cache-to: type=gha,mode=max,scope=tex-worker
      - run: docker compose -f compose.production.yaml up -d --wait postgres
      # Migrate dan seed dijalankan dua kali dengan sengaja: run kedua memverifikasi idempotensi.
      - run: docker compose -f compose.production.yaml run --rm backend bun scripts/migrate-db.ts
      - run: docker compose -f compose.production.yaml run --rm backend bun scripts/migrate-db.ts
      - run: docker compose -f compose.production.yaml run --rm backend bun scripts/seed-db.ts
      - run: docker compose -f compose.production.yaml run --rm backend bun scripts/seed-db.ts
      - run: docker compose -f compose.production.yaml up -d --wait
      - run: bun scripts/verify-containers.mjs
      - if: failure()
        run: docker compose -f compose.production.yaml logs
      - if: always()
        run: docker compose -f compose.production.yaml down -v

  publish:
    needs: containers
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: apps/api/Dockerfile
          - component: frontend
            dockerfile: apps/web/Dockerfile
          - component: tex-worker
            dockerfile: apps/tex-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Free disk space for multi-platform images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,format=long,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=staging-,enable=${{ github.ref == 'refs/heads/staging' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
