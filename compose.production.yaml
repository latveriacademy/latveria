name: ${COMPOSE_PROJECT_NAME:-latveria-prod}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-latveria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-latveria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-latveria}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - storage_data:/data
    ports:
      - "${STORAGE_CONSOLE_BIND:-127.0.0.1}:${STORAGE_CONSOLE_PORT:-9001}:9001"
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  migrator:
    image: ${IMAGE_PREFIX:-ghcr.io/latveriacademy/latveria}-backend:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["bun", "scripts/migrate-db.ts"]
    environment:
      NODE_ENV: production
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-latveria}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-latveria-avatars}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  tex-worker:
    image: ${IMAGE_PREFIX:-ghcr.io/latveriacademy/latveria}-tex-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3002
    expose:
      - "3002"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=production"

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/latveriacademy/latveria}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVE_WEB: "false"
      TEX_WORKER_URL: http://tex-worker:3002
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-latveria}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-latveria-avatars}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-/api/avatar}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      tex-worker:
        condition: service_started
    expose:
      - "3001"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=production"

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/latveriacademy/latveria}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=production"

  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "production"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-600}
      WATCHTOWER_ROLLING_RESTART: "true"
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_PAT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/dev/null}:/config.json:ro

volumes:
  postgres_data:
  storage_data:
