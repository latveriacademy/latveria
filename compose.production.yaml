services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-latveria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-latveria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrator:
    image: ${IMAGE_PREFIX:-ghcr.io/latveriacademy/latveria}-backend:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["bun", "scripts/migrate-db.ts"]
    environment:
      NODE_ENV: production
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Isi DATABASE_MIGRATION_URL}
    depends_on:
      postgres:
        condition: service_healthy

  tex-worker:
    image: ${IMAGE_PREFIX:-ghcr.io/latveriacademy/latveria}-tex-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3002
    expose:
      - "3002"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/latveriacademy/latveria}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVE_WEB: "false"
      TEX_WORKER_URL: http://tex-worker:3002
      DATABASE_URL: ${DATABASE_URL:?Isi DATABASE_URL}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Isi DATABASE_MIGRATION_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Isi BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Isi BETTER_AUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      tex-worker:
        condition: service_started
    expose:
      - "3001"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/latveriacademy/latveria}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_ROLLING_RESTART: "true"
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_PAT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/dev/null}:/config.json:ro

volumes:
  postgres_data:
